[package]
name = "syntax"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
text.workspace = true
# TextMate grammars, which VS Code extensions bring: their rules are
# regular expressions with look-behind and back-references, which `regex`
# does not have. This is built on it, in Rust. Grammars are JSON or
# property lists, read with what `import` already has.
fancy-regex = "0.19.2"
serde_json = "1.0.151"
import = { path = "../import" }
tree-sitter = { workspace = true, features = ["wasm"] }
ropey.workspace = true
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
