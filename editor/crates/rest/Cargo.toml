[package]
name = "rest"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# HTTP requests for the editor's HTTP client. reqwest is the build GPUI
# already compiles (zed-reqwest, rustls), with a subset of its features.
[dependencies]
regex = "1.13.1"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["charset", "http2", "rustls-tls-native-roots"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
yaml-rust2 = "0.13.0"
