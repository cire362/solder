[package]
name = "db"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# TLS everywhere is rustls with the ring provider, which GPUI's HTTP client
# already builds. Default features are off where they would pull in aws-lc.
[dependencies]
futures = "0.3.34"
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "column_decltype"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
url = "2.5.8"
webpki-roots = "1"
yaml-rust2 = "0.13.0"
