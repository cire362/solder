[package]
name = "ai"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Local models: hardware, a catalog, downloads, llama-server and a benchmark.
# reqwest is the build GPUI already compiles (zed-reqwest, rustls); sha2 is
# already in the tree through gpui and checks downloads while they stream.
[dependencies]
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["http2", "rustls-tls-native-roots"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
