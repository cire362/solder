[package]
name = "import"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Reads what other editors keep (VS Code, Cursor, Zed, JetBrains) and turns
# it into Solder's settings, key bindings and themes. No GPUI, no writing:
# the app decides what to apply.
[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
