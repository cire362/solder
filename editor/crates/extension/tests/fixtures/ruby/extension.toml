id = "ruby"
name = "Ruby"
version = "0.16.21"
schema_version = 1
description = "Ruby support."
repository = "https://github.com/zed-extensions/ruby"
authors = ["Vitaly Slobodin <vitaliy.slobodin@gmail.com>"]
themes = []
icon_themes = []
languages = ["languages/yaml-erb", "languages/rbs", "languages/ruby", "languages/html-erb", "languages/js-erb", "languages/erb"]

[lib]
kind = "Rust"
version = "0.7.0"

[grammars.embedded_template]
repository = "https://github.com/tree-sitter/tree-sitter-embedded-template"
rev = "c70c1de07dedd532089c0c90835c8ed9fa694f5c"

[grammars.rbs]
repository = "https://github.com/joker1007/tree-sitter-rbs"
rev = "5282e2f36d4109f5315c1d9486b5b0c2044622bb"

[grammars.ruby]
repository = "https://github.com/tree-sitter/tree-sitter-ruby"
rev = "71bd32fb7607035768799732addba884a37a6210"

[language_servers.fuzzy-ruby-server]
languages = ["Ruby"]

[language_servers.fuzzy-ruby-server.language_ids]

[language_servers.herb]
languages = ["HTML+ERB"]

[language_servers.herb.language_ids]

[language_servers.kanayago]
languages = ["Ruby"]

[language_servers.kanayago.language_ids]

[language_servers.rubocop]
languages = ["Ruby"]

[language_servers.rubocop.language_ids]

[language_servers.ruby-lsp]
languages = ["Ruby", "ERB", "HTML+ERB", "YAML+ERB", "JS+ERB", "Slim"]

[language_servers.ruby-lsp.language_ids]
ERB = "erb"
"YAML+ERB" = "erb"
Slim = "slim"
"JS+ERB" = "erb"
"HTML+ERB" = "erb"
Ruby = "ruby"

[language_servers.solargraph]
languages = ["Ruby"]

[language_servers.solargraph.language_ids]

[language_servers.sorbet]
languages = ["Ruby"]

[language_servers.sorbet.language_ids]

[language_servers.steep]
languages = ["Ruby"]

[language_servers.steep.language_ids]

[context_servers]

[slash_commands]

[[capabilities]]
kind = "process:exec"
command = "gem"
args = ["install", "--norc", "--no-user-install", "--no-format-executable", "--no-document", "*"]

[[capabilities]]
kind = "process:exec"
command = "gem"
args = ["uninstall", "--norc", "*", "--version", "*"]

[[capabilities]]
kind = "process:exec"
command = "gem"
args = ["list", "--norc", "--exact", "*"]

[[capabilities]]
kind = "process:exec"
command = "bundle"
args = ["info", "--version", "*"]

[[capabilities]]
kind = "process:exec"
command = "gem"
args = ["outdated", "--norc"]

[[capabilities]]
kind = "process:exec"
command = "gem"
args = ["update", "--norc", "*"]

[[capabilities]]
kind = "process:exec"
command = "ruby"
args = ["--version"]

[debug_adapters.rdbg]

[debug_locators.ruby]
