[package]
name = "solder_plugin"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# What a plugin is written against, and the messages it exchanges with the
# editor. Builds for wasm32-unknown-unknown (the plugin) and natively (the
# host reads the same message types, and plugin authors run unit tests).
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
