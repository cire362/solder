[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
ropey = "1.6"
tree-sitter = "0.25"
mimalloc = { version = "0.1", default-features = false }
unicode-segmentation = "1.12"
text = { path = "crates/text" }
syntax = { path = "crates/syntax" }

# Release is what the site's numbers are measured on: one codegen unit, fat LTO,
# no unwinding tables. Cold start and input latency both benefit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

# Profiling build: release speed with symbols for Instruments / perf.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# Keep dev builds usable: optimize dependencies (gpui, tree-sitter) even in debug.
[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 0
