name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  editor:
    name: Editor
    # Linux runners cost a tenth of macOS ones on private repos. GPUI's Linux
    # backend needs these headers to compile; tests use its headless platform.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
      - name: Compile Rust tests
        run: cargo test --workspace --profile ci --locked --no-run
      - name: Run Rust tests
        timeout-minutes: 5
        run: cargo test --workspace --profile ci --locked
