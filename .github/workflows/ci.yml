name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The editor's example plugins in TypeScript, checked where Node is.
      - run: npm run plugins
      - run: npm run build

  editor:
    name: Editor
    # Linux runners cost a tenth of macOS ones on private repos. GPUI's Linux
    # backend needs these headers to compile; tests use its headless platform.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    # Real servers for the database drivers (crates/db/tests/servers.rs).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: solder
          POSTGRES_DB: solder
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: solder
          MYSQL_DATABASE: solder
        ports: ["53306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -psolder" --health-interval 2s --health-retries 60
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      mongo:
        image: mongo:8
        ports: ["57017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s --health-retries 30
    env:
      SOLDER_TEST_POSTGRES: postgres://postgres:solder@localhost:55432/solder
      SOLDER_TEST_MYSQL: mysql://root:solder@localhost:53306/solder
      SOLDER_TEST_REDIS: redis://localhost:56379
      SOLDER_TEST_MONGO: mongodb://localhost:57017/solder
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libzstd-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The plugin host's tests build real plugins.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
      - name: Compile Rust tests
        run: cargo test --workspace --profile ci --locked --no-run
      - name: Run Rust tests
        timeout-minutes: 5
        run: cargo test --workspace --profile ci --locked
      - name: Verify database TLS
        timeout-minutes: 5
        run: bash scripts/test-db-tls.sh
