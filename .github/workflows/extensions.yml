name: Extensions of Open VSX

# The check of a release: the most installed extensions of Open VSX are
# installed, started and asked what they do, and the list of what works is
# the result. It runs the code of third parties, which has no sandbox, so
# it runs here, on a machine that is thrown away, with no secrets and with
# leave to read the repository and nothing more.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: Native first-party verification or explicit published-extension census
        type: choice
        options: [native-verification, census]
        default: native-verification
      verification_ref:
        description: Native verification source ref (empty uses the dispatched ref)
        type: string
        default: ""
      count:
        description: How many of the most installed to try
        default: "50"
      extension:
        description: Optional exact extension, such as vscode.ipynb@1.95.3
        default: ""

permissions:
  contents: read

jobs:
  census:
    if: github.event_name == 'release' || inputs.mode == 'census'
    name: What works
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # cmake is for wasmtime, which the crate that reads extensions has.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config cmake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
      - name: Install, start and ask
        env:
          COUNT: ${{ inputs.count || '50' }}
          EXTENSION: ${{ inputs.extension }}
        run: |
          args=()
          if [ -n "$EXTENSION" ]; then args+=(--extension "$EXTENSION"); fi
          cargo run --locked --release -p extension --bin extension-census -- \
            --count "$COUNT" --out "$RUNNER_TEMP/extensions.md" "${args[@]}"
      - name: The list
        run: cat "$RUNNER_TEMP/extensions.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: ${{ runner.temp }}/extensions.md

  native-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'native-verification'
    name: Native notebooks and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: editor
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verification_ref || github.ref }}
          persist-credentials: false
      # Reuse the editor CI's existing build dependencies. This job cannot run
      # extension-census or install a published extension.
      - name: GPUI build libraries already used by editor CI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libzstd-dev libwebkit2gtk-4.1-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
          cache-on-failure: true
      - name: Fetch the existing locked build dependencies
        env:
          NATIVE_EVIDENCE: ${{ runner.temp }}/solder-native-evidence
        run: |
          mkdir -p "$NATIVE_EVIDENCE"
          cargo fetch --locked --target "$(rustc -vV | sed -n 's/host: //p')" > "$NATIVE_EVIDENCE/fetch.log" 2>&1
      - name: First-party native windows and OS input
        env:
          NATIVE_EVIDENCE: ${{ runner.temp }}/solder-native-evidence
        run: python scripts/verify-native-ci.py --out "$NATIVE_EVIDENCE"
      - name: Native evidence summary
        if: always()
        env:
          NATIVE_EVIDENCE: ${{ runner.temp }}/solder-native-evidence
        run: |
          if [ -f "$NATIVE_EVIDENCE/summary.md" ]; then
            cat "$NATIVE_EVIDENCE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Native verification did not produce a report; inspect the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/solder-native-evidence/**
            !${{ runner.temp }}/solder-native-evidence/cargo-target/**
          if-no-files-found: error
